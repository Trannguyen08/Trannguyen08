<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="CI/CD pipeline: Push, Lint, Test, Build, Deploy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#36bcf7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="170" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="798" height="168" rx="15" fill="none" stroke="#30363d"/>

  <!-- track -->
  <line x1="80" y1="70" x2="720" y2="70" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="70" x2="720" y2="70" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" values="44;0" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="80" cy="70" r="28" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="2.5">
        <animate attributeName="fill-opacity" values="0.9;0.15;0.15" keyTimes="0;0.5;1" dur="5s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="77" fill="#fff" font-size="20" font-weight="700">1</text>
      <text x="80" y="126" fill="#c9d1d9" font-size="15" font-weight="600">PUSH</text>
      <text x="80" y="146" fill="#8b949e" font-size="12">git push / PR</text>
    </g>
    <g>
      <circle cx="240" cy="70" r="28" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="2.5">
        <animate attributeName="fill-opacity" values="0.9;0.15;0.15" keyTimes="0;0.5;1" dur="5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="240" y="77" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="240" y="126" fill="#c9d1d9" font-size="15" font-weight="600">LINT</text>
      <text x="240" y="146" fill="#8b949e" font-size="12">ruff / eslint</text>
    </g>
    <g>
      <circle cx="400" cy="70" r="28" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5">
        <animate attributeName="fill-opacity" values="0.9;0.15;0.15" keyTimes="0;0.5;1" dur="5s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="400" y="77" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="400" y="126" fill="#c9d1d9" font-size="15" font-weight="600">TEST</text>
      <text x="400" y="146" fill="#8b949e" font-size="12">pytest</text>
    </g>
    <g>
      <circle cx="560" cy="70" r="28" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="2.5">
        <animate attributeName="fill-opacity" values="0.9;0.15;0.15" keyTimes="0;0.5;1" dur="5s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <text x="560" y="77" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="560" y="126" fill="#c9d1d9" font-size="15" font-weight="600">BUILD</text>
      <text x="560" y="146" fill="#8b949e" font-size="12">Docker image</text>
    </g>
    <g>
      <circle cx="720" cy="70" r="28" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="2.5">
        <animate attributeName="fill-opacity" values="0.9;0.15;0.15" keyTimes="0;0.5;1" dur="5s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <text x="720" y="77" fill="#fff" font-size="20" font-weight="700">5</text>
      <text x="720" y="126" fill="#c9d1d9" font-size="15" font-weight="600">DEPLOY</text>
      <text x="720" y="146" fill="#8b949e" font-size="12">GitHub Actions</text>
    </g>
  </g>

  <!-- moving packet -->
  <circle cy="70" r="7" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="80;720;720" keyTimes="0;0.8;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
